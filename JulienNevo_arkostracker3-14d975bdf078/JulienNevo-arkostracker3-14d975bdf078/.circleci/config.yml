            curl -s https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
            sudo apt-add-repository -y 'deb https://apt.kitware.com/ubuntu/ focal main'
            sudo apt-get update
            sudo apt-get install -y cmake g++-10 libstdc++-10-dev \
                libasound2-dev libjack-jackd2-dev \
                ladspa-sdk \
                libfreetype6-dev \
                libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev \
                libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
                libglu1-mesa-dev mesa-common-dev \
