  # This is a copy/paste of what is below, with ZIP.
  build-windows-zip:
    executor: win/default
    steps:
      - checkout
      - run:
          name: "Install software"
          command: choco install -y --no-progress cmake nsis
      # Not using the latest VS17 2022, because the user won't probably have it, will have to install the right redistributable.
      - run:
          name: "Create CMake project"
          command: |
            cp .\cpack\usedConfig_zip.template.cmake .\cpack\usedConfig.cmake
            C:\Program` Files\CMake\bin\cmake -G 'Visual Studio 16 2019' -A Win32 .
      #- run:
      #    name: "Build main project and tools"
      #    command: C:\Program` Files\CMake\bin\cmake --build . --config Release --target <<pipeline.parameters.targets>>
      - run:
          name: "Build and package ZIP"
