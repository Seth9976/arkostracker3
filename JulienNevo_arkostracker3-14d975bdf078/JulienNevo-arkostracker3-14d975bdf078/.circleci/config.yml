workflows:
  linux64:
    when:
      equal: [ linux64, << pipeline.parameters.build_type >> ]
    jobs:
      - build-linux64

  linux64_tests:
    when:
      equal: [ linux64_tests, << pipeline.parameters.build_type >> ]
    jobs:
      - build-linux64-tests

  linux_arm64:
    when:
      equal: [ linux_arm64, << pipeline.parameters.build_type >> ]
    jobs:
      - build-linux-arm64

  macos:
    when:
      equal: [ macos, << pipeline.parameters.build_type >> ]
    jobs:
      - build-mac

  macos_tests:
    when:
      equal: [ macos_tests, << pipeline.parameters.build_type >> ]
    jobs:
      - build-mac-tests

  windows_zip:
    when:
      equal: [ windows_zip, << pipeline.parameters.build_type >> ]
    jobs:
      - build-windows-zip

  windows_nsis:
    when:
      equal: [ windows_nsis, << pipeline.parameters.build_type >> ]
    jobs:
      - build-windows-nsis

