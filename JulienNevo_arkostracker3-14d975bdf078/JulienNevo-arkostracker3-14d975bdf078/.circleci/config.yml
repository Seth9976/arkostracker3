# CMake installed with the help of https://github.com/Toxe/example-cpp-ci-project/tree/master/.circleci

# NOTE: Jobs including TUs are too long (more than one hour!), CircleCi stops!!
# So test must be called independently using a build type :(.
# TO IMPROVE: Windows TUs won't run fully (crash, no idea why). Oh, well.

orbs:
  win: circleci/windows@4.1.1
  macos: circleci/macos@2.2.0

version: 2.1

parameters:
  build_type:
    type: enum
    enum: [ linux64, linux64_tests, linux_arm64, macos, macos_tests, windows_zip, windows_nsis ]
    default: linux64
  upload:
    type: boolean
    default: true

jobs:
  build-linux64:
    docker:
      - image: cimg/base:stable    # See https://circleci.com/developer/images/image/cimg/base
    environment:
      CC: gcc-10
      CXX: g++-10
    steps:
      - checkout
      - run:
          name: "Install software"
          # The "kitware" lines are needed to get, at least, the latest CMake version, else the one in the image is too old.
          # The echo to BASH_ENV is a trick to pass variables among steps. Seems not useful on Mac only.
          command: |
            tempProjectVersion="$(cat ProjectVersion.txt)"
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            curl -s https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
            sudo apt-add-repository -y 'deb https://apt.kitware.com/ubuntu/ focal main'
            sudo apt-get update
            sudo apt-get install -y cmake g++-10 libstdc++-10-dev \
                libasound2-dev libjack-jackd2-dev \
                ladspa-sdk \
                libfreetype6-dev \
                libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev \
                libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
                libglu1-mesa-dev mesa-common-dev \
                rpm
      - run:
          name: "Create CMake project"
          command: |
            cp cpack/usedConfig_zip.template.cmake cpack/usedConfig.cmake
            cmake -DCMAKE_BUILD_TYPE=Release -G 'CodeBlocks - Unix Makefiles' .
      #- run:
      #    name: "Build main project and tools"
      #    command: |
      #      cmake --build . --target <<pipeline.parameters.targets>>
      - run:
          name: "Build and package ZIP"
          command: |
            cmake --build . --target package
      - when:
          condition: <<pipeline.parameters.upload>>
          steps:
            - store_artifacts:
                name: "Upload ZIP artefact"
                path: ArkosTracker.zip
                destination: ArkosTracker-linux64.zip

      - run:
          # Contrary to Windows, this works without having to --fresh!
          name: "Build and package DEB and RPM"
          command: |
            cp cpack/usedConfig_not_zip.template.cmake cpack/usedConfig.cmake
            cmake --build . --target package
      - when:
          condition: <<pipeline.parameters.upload>>
          steps:
            - store_artifacts:
                name: "Upload DEB artefact"
                path: ArkosTracker.deb
                destination: ArkosTracker-linux64.deb
            - store_artifacts:
                name: "Upload RPM artefact"
                path: ArkosTracker.rpm
                destination: ArkosTracker-linux64.rpm

  build-linux64-tests:
    docker:
      - image: cimg/base:2024.01-20.04
    environment:
      CC: gcc-10
      CXX: g++-10
    steps:
      - checkout
      - run:
          name: "Install software"
          command: |
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            curl -s https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
            sudo apt-add-repository -y 'deb https://apt.kitware.com/ubuntu/ focal main'
            sudo apt-get update
            sudo apt-get install -y cmake g++-10 libstdc++-10-dev \
                libasound2-dev libjack-jackd2-dev \
                ladspa-sdk \
                libfreetype6-dev \
                libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev \
                libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
                libglu1-mesa-dev mesa-common-dev \
                rpm
      - run:
          name: "Create CMake project for test units"
          command: cmake -DCMAKE_BUILD_TYPE=Debug -G 'CodeBlocks - Unix Makefiles' .
      - run:
          name: "Build test units"
          command: cmake --build . --config Debug --target TestUnits
      - run:
          name: "Run test units"
          command: ./testUnits/TestUnits_artefacts/Debug/TestUnits -r xml -d yes --order lex

  build-linux-arm64:
    machine:
      image: ubuntu-2004:current    # Using 2004 because it contains libssl. The 2204 does not.
    resource_class: arm.medium
    environment:
      CC: gcc-10
