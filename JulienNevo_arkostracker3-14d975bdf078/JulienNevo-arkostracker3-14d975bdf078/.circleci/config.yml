            C:\Program` Files\CMake\bin\cmake --build . --config Release --target package
      - when:
          condition: <<pipeline.parameters.upload>>
          steps:
            - store_artifacts:
                name: "Upload ZIP artefact"
                path: ArkosTracker.zip
                destination: ArkosTracker-windows.zip

